spring.application.name=bank-api

# ---------- Session cookie hardening (BA-37) ----------
# HttpOnly: JavaScript cannot read the session cookie, so injected scripts cannot steal it
server.servlet.session.cookie.http-only=true
# SameSite=Lax: other websites cannot make the browser send the cookie with their POST requests
server.servlet.session.cookie.same-site=lax
# Secure (send only over HTTPS) is switched on ONLY on Render, with the environment variable
# SERVER_SERVLET_SESSION_COOKIE_SECURE=true. Local runs use plain http://localhost, where a
# Secure cookie would never be sent back and login would break.