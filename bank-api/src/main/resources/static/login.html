<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank App · Sign in</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand brand-dark">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span class="brand-name">Bank App</span>
    </div>
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-subtitle">Welcome back. Sign in to see your accounts.</p>

    <form class="auth-form" id="login-form">
        <label class="field">
            <span class="field-label">Username</span>
            <input class="field-input" name="username" type="text" autocomplete="username" required>
        </label>
        <label class="field">
            <span class="field-label">Password</span>
            <input class="field-input" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="button button-block" type="submit" id="submit">Sign in</button>
    </form>

    <p class="auth-switch">New here? <a href="/register.html">Create an account</a></p>
</main>

<script type="module" src="login.js"></script>
</body>
</html>
