<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank App · Accounts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">B</span>
            <span class="brand-name">Bank App</span>
        </a>
        <div class="header-right">
            <nav class="main-nav" aria-label="Main">
                <a href="/" aria-current="page">Accounts</a>
                <span class="nav-soon" title="Coming in Phase 9">Transactions</span>
                <span class="nav-soon" title="Coming later">Profile</span>
            </nav>
            <div class="user-area" id="user-area" hidden>
                <span class="user-name" id="user-name"></span>
                <button class="button button-ghost" type="button" id="logout">Sign out</button>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <h1 class="page-title">Accounts overview</h1>

    <section class="summary" aria-labelledby="summary-label">
        <p class="summary-label" id="summary-label">Total balance</p>
        <p class="summary-amount" id="total">–</p>
        <p class="summary-meta" id="status" aria-live="polite">Loading accounts…</p>
    </section>

    <section aria-labelledby="accounts-title">
        <h2 class="section-title" id="accounts-title">Your accounts</h2>
        <div class="state" id="state" hidden></div>
        <div class="account-grid" id="accounts" aria-busy="true"></div>
    </section>
</main>

<footer class="site-footer">
    <div class="container">Bank App · demo project, not a real bank</div>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
