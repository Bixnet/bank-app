<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank App · Create account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand brand-dark">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span class="brand-name">Bank App</span>
    </div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Choose a username and a password.</p>

    <form class="auth-form" id="register-form">
        <label class="field">
            <span class="field-label">Username</span>
            <input class="field-input" name="username" type="text" autocomplete="username"
                   required minlength="3" maxlength="30" aria-describedby="username-hint">
            <span class="field-hint" id="username-hint">3 to 30 characters: letters, digits, dot, dash or underscore.</span>
        </label>
        <label class="field">
            <span class="field-label">Password</span>
            <input class="field-input" name="password" type="password" autocomplete="new-password"
                   required minlength="8" aria-describedby="password-hint">
            <span class="field-hint" id="password-hint">At least 8 characters.</span>
        </label>
        <label class="field">
            <span class="field-label">Repeat password</span>
            <input class="field-input" name="confirm" type="password" autocomplete="new-password" required>
        </label>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="button button-block" type="submit" id="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
</main>

<script type="module" src="register.js"></script>
</body>
</html>
